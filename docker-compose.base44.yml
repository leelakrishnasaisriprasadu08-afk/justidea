services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: justidea
      POSTGRES_PASSWORD: justidea_dev_password
      POSTGRES_DB: justidea
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justidea -d justidea"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: Just Idea API
      base44.kind: api
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://justidea:justidea_dev_password@db:5432/justidea
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/ideas').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: Just Idea
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_URL=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
  api_node_modules:
  db_data:
