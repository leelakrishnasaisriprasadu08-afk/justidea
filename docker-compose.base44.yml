services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: Just Idea
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
